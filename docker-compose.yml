version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: chem_user
      POSTGRES_PASSWORD: chem_pass
      POSTGRES_DB: chem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  postgres_data:
