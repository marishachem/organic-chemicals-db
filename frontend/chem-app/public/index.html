<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Приложение для поиска химических соединений по SMILES"
    />
    <title>Поиск химических соединений</title>
    
    <!-- Предзагрузка RDKit для ускорения инициализации -->
    <link rel="preload" href="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js" as="script">
    
    <!-- Иконочный шрифт Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Фавикон -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Manifest для PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <noscript>Для работы приложения необходимо включить JavaScript.</noscript>
    <div id="root"></div>
    
    <!-- Загрузка RDKit из CDN -->
    <script src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
  </body>
</html>
